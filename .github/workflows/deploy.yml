name: Sync LinkedIn & deploy
on:
  push:
    branches: [astro-v2]
    tags: ['*v*-release']
  schedule:
    - cron: '0 18 * * *'   # every day 01:00 WIB
  workflow_dispatch:

permissions: { contents: write, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: true }

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci

      - name: Pull latest LinkedIn profile
        run: npm run sync:linkedin
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          LINKEDIN_URL: https://www.linkedin.com/in/fadhelijlalfalah/

      - name: Commit data if it changed
        run: |
          if ! git diff --quiet -- src/data/experience.json src/data/education.json; then
            git config user.name  "linkedin-sync[bot]"
            git config user.email "linkedin-sync@users.noreply.github.com"
            git add src/data/experience.json src/data/education.json src/data/sync-meta.json
            git commit -m "chore(data): sync LinkedIn experience"
            git push origin HEAD:astro-v2 || echo 'branch moved on; data will be picked up next run'
          fi

      - run: npx astro build
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages }
    steps:
      - uses: actions/deploy-pages@v4
